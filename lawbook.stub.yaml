# The same rules as lawbook.yaml, judged by proof/stub-judge/claude instead of
# a model. For smoke-testing the model stage with no credentials: lawbook's
# `claude-code` provider runs the first `claude` on PATH, so put the stub there.
#
#   PATH="$PWD/proof/stub-judge:$PATH" LAWBOOK_CONFIG=lawbook.stub.yaml VERIFY_LLM=1 \
#     sh .claude/skills/verify/scripts/verify.sh
#
# `extends` inherits only the rules; this file's `llm` block replaces the judge.
version: 1
extends: ./lawbook.yaml
llm:
  provider: claude-code
  model: stub
  maxRequests: 200
rules: []
