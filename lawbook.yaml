# yaml-language-server: $schema=https://raw.githubusercontent.com/drew-simmons/lawbook/main/lawbook.schema.json
#
# What "clean" means in this repository, as rules the verify loop checks on
# every change. The deterministic rules always run and cost milliseconds.
# The `standard` rules are prose judged by a model, one request per changed
# file; verify.sh runs them only when AWS_REGION is set for Bedrock and every
# deterministic stage is green, and they warn rather than fail.
version: 1

llm:
  provider: bedrock
  maxRequests: 20

rules:
  # ---- the tree -----------------------------------------------------------
  - id: has-readme
    description: The repository explains itself
    exists: ["README.md"]

  - id: has-tests
    description: There is a test suite to measure coverage against
    exists: ["test/**/*.test.js"]

  - id: no-env-file
    description: Secrets never live in the tree
    absent: [".env", "**/*.pem"]

  # ---- library code -------------------------------------------------------
  - id: no-console
    description: Library code does not print; callers decide what to log
    files: &library ["src/**/*.js"]
    forbid: 'console\.'
    message: remove the console call; return a value or throw instead

  - id: library-does-no-io
    description: The library is pure; the caller owns time, files, and the network
    files: *library
    forbid: 'from "node:(fs|http|https|net|child_process|os)"|\bfetch\(|process\.(exit|env)|Date\.now\(|new Date\('
    message: take the value as a parameter; the caller does the I/O (see placeOrder's deps)

  - id: no-empty-catch
    description: Errors are handled or passed up, never swallowed
    files: *library
    forbid: 'catch\s*(\([^)]*\))?\s*\{\s*\}'
    message: handle the error here or let it propagate; an empty catch hides failures

  - id: no-eval
    description: No code is built from strings
    files: *library
    forbid: '\beval\(|new Function\('
    message: express the logic in code

  - id: no-nested-ternary
    description: One decision per expression
    files: *library
    forbid: '\s\?\s.*\s\?\s'
    message: split the nested ternary into guard clauses or a lookup table

  - id: no-default-export
    description: Named exports are greppable and refactorable
    files: *library
    forbid: '^export default'
    message: use a named export

  # forbid scans line by line, so this is a require with a whole-file lookahead:
  # anchored at the start of the file, it matches only when no `export function`
  # line follows something other than the end of a doc comment.
  - id: exports-are-documented
    description: Every exported function has a doc comment above it
    files: *library
    require: '(?<![\s\S])(?![\s\S]*?(?<!\*/)\nexport (async )?function)'
    message: an exported function has no /** doc comment */ above it

  # ---- all code -----------------------------------------------------------
  - id: no-loose-equality
    description: Strict comparison only
    files: &code ["src/**/*.js", "test/**/*.js"]
    forbid: '(^|[^=!<>])[=!]=[^=]'
    message: use === or !==

  - id: no-var
    description: Block-scoped bindings only
    files: *code
    forbid: '^\s*var\s'
    message: use const, or let when it must change

  - id: no-orphan-todos
    description: Every TODO cites an issue
    files: *code
    forbid: '(//|/\*|\*)\s*(TODO|FIXME|HACK|XXX)\b(?!.*(#\d+|[A-Z][A-Z0-9]+-\d+|https?://))'
    message: link the comment to an issue, such as TODO(#123), or do it now

  # ---- prose standards, judged by a model, warn only ----------------------
  - id: names-reveal-intent
    description: Every name says what the thing is or does
    level: warn
    files: *library
    standard: |
      Every name says what the thing is or does without needing a comment. A
      variable's name says what it holds, a function's name says what it does,
      and a boolean reads as a question. No name is a vague placeholder such
      as data, info, item, temp, obj, result, manager, helper, or util. One
      word stands for one concept throughout the file. Exempt: a loop index
      in a loop of a few lines and abbreviations the domain itself uses.

  - id: functions-do-one-thing
    description: Every function does one thing at one level of abstraction
    level: warn
    files: *library
    standard: |
      Every function does one thing, stated by its name, at one level of
      abstraction. A function that could be split into named steps, that mixes
      computing a result with formatting or input and output, or whose body
      falls into sections marked by blank lines or comments, is doing more
      than one thing. Functions take few parameters, and none takes a boolean
      flag that selects between two behaviors. Exempt: an entry point whose
      only job is to call the steps in order.

  - id: guard-clauses-over-nesting
    description: The main path reads straight down
    level: warn
    files: *library
    standard: |
      Preconditions and edge cases return or throw early at the top of a
      function, so the main path reads straight down without nesting. No code
      nests more than three levels of blocks inside a function. A compound
      condition that needs thought is given a name by a variable or a
      function.

  - id: errors-are-handled-not-hidden
    description: Every failure is handled or passed up with context
    level: warn
    files: *library
    standard: |
      Every failure is either handled where something can be done about it or
      passed up with context; none is silently swallowed. A function that
      cannot do what its name promises throws or returns an explicit error
      instead of null, -1, an empty value, or a success code. Error messages
      name what went wrong, the value that caused it, and what to do next.

  - id: dependencies-are-injected
    description: Logic can be tested without the outside world
    level: warn
    files: *library
    standard: |
      A function that computes a result does not also reach for a clock, a
      random source, an environment variable, a global, the network, or the
      filesystem inside its body; those come in through parameters so a test
      can substitute them. Business rules take plain values and return plain
      values. Exempt: a composition root whose only job is to wire real
      dependencies together.

  - id: tests-describe-behavior
    description: Every test reads as a specification
    level: warn
    files: ["test/**/*.test.js"]
    threshold: 0.6
    standard: |
      Every test reads as a specification. Its name states the behavior and
      the condition, such as "rejects an expired token", not the name of the
      function under test. Each test asserts on observable outcomes, not on
      which internal calls were made, and depends on no other test, on no
      wall clock, and on no network.
