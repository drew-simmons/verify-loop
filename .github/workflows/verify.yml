name: verify

# The gate Claude runs before a commit, run on every pull request so a
# teammate's change passes the same rules. The proofs run on pushes to main
# as well; the gate does not, because verify.sh diffs against the base branch
# and a push to main has nothing to diff. Both come from the factory plugin
# (github.com/drew-simmons/factory); this repository owns .factory/config.sh,
# lawbook.yaml, and the proofs.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  HUNK: "0" # no Hunk session in CI; session-start.sh skips the install too
  VERIFY_LLM: "0" # no credentials in CI; the prose standards stay off
  FACTORY_REF: v0.1.0
  POLY_CRAP_VERSION: "0.8.2"
  LAWBOOK_VERSION: "0.2.0"

jobs:
  gate:
    name: verify against the base branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the merge base with the base branch
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: drew-simmons/factory@v0.1.0
        with:
          base: origin/${{ github.base_ref }}
          poly-crap-version: ${{ env.POLY_CRAP_VERSION }}
          lawbook-version: ${{ env.LAWBOOK_VERSION }}

  prove:
    name: the loop's own proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: drew-simmons/factory
          ref: ${{ env.FACTORY_REF }}
          path: .factory-plugin
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the loop's tools
        run: |
          CLAUDE_PLUGIN_ROOT="$PWD/.factory-plugin/plugins/factory" sh .factory-plugin/plugins/factory/hooks/session-start.sh
          echo "$HOME/.local/share/factory/bin" >> "$GITHUB_PATH"
          echo "FACTORY_ROOT=$PWD/.factory-plugin/plugins/factory" >> "$GITHUB_ENV"
      - name: The tools are present
        run: poly-crap --version && lawbook --version
      # BASE=HEAD: each scenario's edit is the whole diff, not the pull
      # request's changes plus the edit; and a CI checkout has origin/main but
      # no local main, which prove-llm.sh would otherwise default to.
      - name: prove.sh
        run: BASE=HEAD sh proof/prove.sh
      - name: prove-llm.sh with the stub judge
        run: BASE=HEAD sh proof/prove-llm.sh --stub
