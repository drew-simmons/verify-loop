# The same rules as lawbook.yaml, judged by proof/stub-judge.mjs instead of a
# model. For smoke-testing the model stage with no credentials:
#
#   node proof/stub-judge.mjs &
#   LAWBOOK_CONFIG=lawbook.stub.yaml VERIFY_LLM=1 sh .claude/skills/verify/scripts/verify.sh
#
# `extends` inherits only the rules; this file's `llm` block replaces the judge.
version: 1
extends: ./lawbook.yaml
llm:
  provider: openai
  model: stub
  baseUrl: http://127.0.0.1:47391/v1
  maxRequests: 200
rules: []
